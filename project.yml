name: LightEditor
options:
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Shared by the app and its share extension, which must match.
    MARKETING_VERSION: "1.0.6"
    CURRENT_PROJECT_VERSION: "1"

packages:
  EditorCore:
    path: Packages/EditorCore

targets:
  LightEditor:
    type: application
    supportedDestinations: [iOS, macOS]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: App
        excludes: ["Resources/MacAppInfo.plist"]
      # LaMa for AI object removal, built by scripts/fetch-models.sh (not checked in).
      - path: Models/LaMa.mlpackage
        optional: true
        buildPhase: sources
      # Depth Anything V2 Small for depth range masks, also from fetch-models.sh.
      - path: Models/DepthAnything.mlpackage
        optional: true
        buildPhase: sources
      # Stable Diffusion 1.5 inpainting for "LaMa + diffusion", also from fetch-models.sh.
      - path: Models/SDInpaintUNet.mlpackage
        optional: true
        buildPhase: sources
      - path: Models/SDInpaintVAEEncoder.mlpackage
        optional: true
        buildPhase: sources
      - path: Models/SDInpaintVAEDecoder.mlpackage
        optional: true
        buildPhase: sources
      - path: Models/SDInpaintEmbeddings.bin
        optional: true
        buildPhase: resources
    dependencies:
      - package: EditorCore
      # "Edit in LightEditor" in the Share menu of Photos (iOS, iPadOS and macOS).
      - target: LightEditorShare
    settings:
      base:
        PRODUCT_NAME: LightEditor
        # PRODUCT_BUNDLE_IDENTIFIER comes from Config/Base.xcconfig, so a local
        # Signing.local.xcconfig can override it.
        GENERATE_INFOPLIST_FILE: YES
        # Merged with the generated keys: the Bonjour service list, which needs an array.
        INFOPLIST_FILE: App/Resources/Info.plist
        # The Mac's adds the photo types it can be handed (Photos' Edit With, Finder's Open With).
        # Not named Info-macOS.plist: CoreFoundation reads a bundled Info-<platform>.plist
        # as that platform's Info.plist, and broke the iOS bundle for the test tools.
        "INFOPLIST_FILE[sdk=macosx*]": App/Resources/MacAppInfo.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Debug Mac builds are ad-hoc signed, so anyone can build and run them;
        # Release (archives for the Mac App Store) signs with the team, like iOS.
        "CODE_SIGN_IDENTITY[config=Debug][sdk=macosx*]": "-"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Resources/LightEditor-macOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": App/Resources/LightEditor-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/Resources/LightEditor-iOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COREML_CODEGEN_LANGUAGE: None
        INFOPLIST_KEY_CFBundleDisplayName: LightEditor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: LightEditor edits the photos in your library. Edits are saved non-destructively, so you can always revert to the original.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: LightEditor saves exported photos to your library.
        INFOPLIST_KEY_PHPhotoLibraryPreventAutomaticLimitedAccessAlert: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: LightEditor connects directly to your other devices nearby, so an iPad can edit the photos on your iPhone.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        # Only standard encryption from Apple's frameworks (HTTPS, and CryptoKit for the
        # device-to-device link), which is exempt, so TestFlight needs no export questions.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # iOS only: the Mac declares document types (MacAppInfo.plist), where NO isn't allowed.
        "INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace[sdk=iphone*]": NO
        "INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace[sdk=macosx*]": YES
      configs:
        Debug:
          # Ad-hoc signed (above), which iCloud doesn't allow: presets stay on this Mac.
          "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Resources/LightEditor-macOS-Debug.entitlements

  # Share extension: "Edit in LightEditor" from a photo in Apple Photos. It only works
  # out which library photo was shared and opens the app on it; editing happens in the
  # app (docs/spikes/open-from-photos.md).
  LightEditorShare:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    configFiles:
      Debug: Config/ShareExtension.xcconfig
      Release: Config/ShareExtension.xcconfig
    sources:
      - path: ShareExtension
    dependencies:
      - package: EditorCore
    settings:
      base:
        PRODUCT_NAME: LightEditorShare
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ShareExtension/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Edit in LightEditor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ShareExtension/LightEditorShare-macOS.entitlements
        "CODE_SIGN_IDENTITY[config=Debug][sdk=macosx*]": "-"
        ENABLE_HARDENED_RUNTIME: YES

  # UI tests: walk the main screens in the iOS simulator at several sizes and Dynamic
  # Type settings, audit them (clipped text, small hit targets, overflow) and save
  # screenshots. Run with scripts/test-ui.sh; see docs/TESTING.md.
  LightEditorUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: UITests
    dependencies:
      - target: LightEditor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.chriskonstad.lighteditor.uitests
        TEST_TARGET_NAME: LightEditor

  # Mac UI tests: the editor, interruptions and performance on the Mac app, with a
  # sample library in /private/tmp (the Debug app's sandbox allows only that). Run
  # with scripts/test-mac-ui.sh; see docs/TESTING.md.
  LightEditorMacUITests:
    type: bundle.ui-testing
    supportedDestinations: [macOS]
    sources:
      - path: MacUITests
        excludes: ["*.txt", "*.json"]
    dependencies:
      - target: LightEditor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        PRODUCT_BUNDLE_IDENTIFIER: com.chriskonstad.lighteditor.macuitests
        TEST_TARGET_NAME: LightEditor

schemes:
  # Declaring any scheme stops Xcode from generating one for the app, so it's spelled
  # out here (scripts/build.sh, testflight.sh and install-device.sh use it).
  LightEditor:
    build:
      targets:
        LightEditor: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  LightEditorUITests:
    build:
      targets:
        LightEditor: [test]
        LightEditorUITests: [test]
    test:
      config: Debug
      targets:
        - LightEditorUITests
  LightEditorMacUITests:
    build:
      targets:
        LightEditor: [test]
        LightEditorMacUITests: [test]
    test:
      config: Debug
      targets:
        - LightEditorMacUITests
