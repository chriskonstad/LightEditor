name: LightEditor
options:
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  EditorCore:
    path: Packages/EditorCore

targets:
  LightEditor:
    type: application
    supportedDestinations: [iOS, macOS]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: App
      # LaMa for AI object removal, built by scripts/fetch-models.sh (not checked in).
      - path: Models/LaMa.mlpackage
        optional: true
        buildPhase: sources
      # Stable Diffusion 1.5 inpainting for "LaMa + diffusion", also from fetch-models.sh.
      - path: Models/SDInpaintUNet.mlpackage
        optional: true
        buildPhase: sources
      - path: Models/SDInpaintVAEEncoder.mlpackage
        optional: true
        buildPhase: sources
      - path: Models/SDInpaintVAEDecoder.mlpackage
        optional: true
        buildPhase: sources
      - path: Models/SDInpaintEmbeddings.bin
        optional: true
        buildPhase: resources
    dependencies:
      - package: EditorCore
    settings:
      base:
        PRODUCT_NAME: LightEditor
        # PRODUCT_BUNDLE_IDENTIFIER comes from Config/Base.xcconfig, so a local
        # Signing.local.xcconfig can override it.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Merged with the generated keys: the Bonjour service list, which needs an array.
        INFOPLIST_FILE: App/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Resources/LightEditor-macOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": App/Resources/LightEditor-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/Resources/LightEditor-iOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COREML_CODEGEN_LANGUAGE: None
        INFOPLIST_KEY_CFBundleDisplayName: LightEditor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: LightEditor edits the photos in your library. Edits are saved non-destructively, so you can always revert to the original.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: LightEditor saves exported photos to your library.
        INFOPLIST_KEY_PHPhotoLibraryPreventAutomaticLimitedAccessAlert: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: LightEditor connects directly to your other devices nearby, so an iPad can edit the photos on your iPhone.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        # Only standard encryption from Apple's frameworks (HTTPS, and CryptoKit for the
        # device-to-device link), which is exempt, so TestFlight needs no export questions.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
